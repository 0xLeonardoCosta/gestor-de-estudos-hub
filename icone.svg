<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Conectando conhecimento: uma estrada sobre curvas de nível liga as três frentes
       (Civil 3D, Revit, Pós), cada nó na cor da sua frente. -->
  <defs>
    <linearGradient id="fundo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f5560"/>
      <stop offset="1" stop-color="#0b1f24"/>
    </linearGradient>
    <linearGradient id="via" x1="10" y1="52" x2="54" y2="12" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4fc4bb"/>
      <stop offset=".5" stop-color="#7fb4ee"/>
      <stop offset="1" stop-color="#dd9fd0"/>
    </linearGradient>
    <clipPath id="c"><rect width="64" height="64" rx="14"/></clipPath>
  </defs>
  <g clip-path="url(#c)">
    <rect width="64" height="64" fill="url(#fundo)"/>
    <g fill="none" stroke="#ffffff" stroke-opacity=".09" stroke-width="1.5">
      <ellipse cx="50" cy="50" rx="10" ry="7"/>
      <ellipse cx="50" cy="50" rx="19" ry="14"/>
      <ellipse cx="50" cy="50" rx="28" ry="21"/>
      <ellipse cx="12" cy="10" rx="9" ry="6"/>
      <ellipse cx="12" cy="10" rx="17" ry="12"/>
    </g>
    <path d="M12 51C30 51 18 32 32 32C46 32 34 13 52 13" fill="none" stroke="#0b1f24" stroke-opacity=".55" stroke-width="10" stroke-linecap="round"/>
    <path d="M12 51C30 51 18 32 32 32C46 32 34 13 52 13" fill="none" stroke="url(#via)" stroke-width="7" stroke-linecap="round"/>
    <path d="M12 51C30 51 18 32 32 32C46 32 34 13 52 13" fill="none" stroke="#0b1f24" stroke-width="1.4" stroke-dasharray="3 3"/>
    <g stroke-width="3">
      <circle cx="12" cy="51" r="6" fill="#ffffff" stroke="#4fc4bb"/>
      <circle cx="32" cy="32" r="6" fill="#ffffff" stroke="#7fb4ee"/>
      <circle cx="52" cy="13" r="6" fill="#ffffff" stroke="#dd9fd0"/>
    </g>
    <g fill="#0b1f24">
      <circle cx="12" cy="51" r="2"/>
      <circle cx="32" cy="32" r="2"/>
      <circle cx="52" cy="13" r="2"/>
    </g>
  </g>
</svg>
