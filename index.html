<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gestor de estudos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/hub.css">
</head>
<body>
<div id="pagina">
  <header class="topo">
    <div><h1>Gestor de estudos</h1><p id="hoje-txt"></p></div>
    <div class="linha">
      <span class="local" title="A sincronização entre computadores entra quando o Supabase for ligado. Até lá, use o backup único para levar os dados de um computador para o outro.">Dados salvos neste navegador</span>
      <button class="btn" data-a="backup">Backup</button>
      <button class="btn" data-a="tema" id="btn-tema"></button>
    </div>
  </header>
  <nav class="frentes" id="frentes" aria-label="Frentes de estudo"></nav>
  <main id="agenda"></main>
  <section id="disp"></section>
</div>
<div id="modal" role="dialog" aria-modal="true"><div class="cx" id="modal-cx"></div></div>
<div id="toast" role="status" aria-live="polite"></div>

<script src="js/armazenamento.js"></script>
<script src="js/ultra-nucleo.js"></script>
<script src="dados/civil3d.js"></script>
<script src="dados/revit.js"></script>
<script src="js/pos-nucleo.js"></script>
<script src="js/hub.js"></script>

</html>
